<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Icon Archives</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    p {
      font-size: 20px;
      color: #bdbdbd;
      margin-bottom: 40px;
    }

    a {
      text-decoration: none;
      background: white;
      color: black;
      padding: 16px 36px;
      border-radius: 50px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    a:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>ICON ARCHIVES</h1>

    <p>
      We’ve moved to iconarchives.com
    </p>

    <a href="https://www.iconarchives.com/">
      ENTER SITE
    </a>
  </div>

</body>
</html>
